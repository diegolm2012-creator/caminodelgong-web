<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TantraGong · Vídeo Noético — El Templo del Gong</title>
  <meta name="description" content="TantraGong · Vídeo Noético. Una pieza audiovisual sobre el gong y el sonido armónico. El Templo del Gong.">
  <meta property="og:title" content="TantraGong · Vídeo Noético">
  <meta property="og:description" content="Una pieza audiovisual sobre el gong y el sonido armónico.">

  <link rel="canonical" href="https://caminodelgong.com/tantra/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #141518;
      --card: #1e2028;
      --text: #e8e6e3;
      --muted: #9ca3af;
      --gold: #c9a84c;
      --copper: #b87333;
      --glow: #d4a543;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at 50% -10%, #16161c 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Georgia, 'Palatino', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .seal {
      color: var(--gold);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 0.72rem;
      margin-bottom: 1.5rem;
      opacity: 0.85;
    }
    .title {
      font-size: clamp(1.9rem, 5vw, 3rem);
      font-weight: normal;
      line-height: 1.15;
      margin-bottom: 0.4rem;
    }
    .title em { color: var(--gold); font-style: normal; }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      max-width: 34rem;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    .stage {
      width: min(920px, 100%);
      background: var(--card);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 14px;
      padding: 0.75rem;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(201,168,76,0.06);
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      background: #000;
    }
    .foot {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.7;
    }
    .foot a { color: var(--gold); text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.5rem auto;
    }
  </style>
</head>
<body>
  <div class="seal">◯ El Templo del Gong</div>
  <h1 class="title">TantraGong<br><em>Vídeo Noético</em></h1>
  <p class="subtitle">Una pieza audiovisual sobre el gong y el sonido armónico.</p>

  <div class="stage">
    <video controls preload="metadata" poster="video/poster.jpg">
      <source src="video/tantragong-noetico.mp4" type="video/mp4">
      Tu navegador no soporta la reproducción de vídeo.
    </video>
  </div>

  <div class="divider"></div>
  <p class="foot">
    <a href="/">Volver al inicio</a><br>
    El Templo del Gong · Camino del Gong
  </p>
